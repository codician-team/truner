# Example: a typical CI workflow on truner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 4 vCPU / 16 GiB, spot with on-demand fallback. The run id keeps machines
    # from picking up jobs of other workflow runs.
    runs-on: truner/cpu=4/run=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm            # stored in your S3 bucket by the magic cache
      - run: npm ci
      - run: npm test

  build-arm:
    runs-on: truner/runner=8cpu-linux-arm64/run=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }   # Go module/build cache via the magic cache
      - run: go build ./...

  matrix:
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: truner/cpu=2/run=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "shard ${{ matrix.shard }} on $TRUNER_INSTANCE_TYPE ($TRUNER_INSTANCE_LIFECYCLE)"

  docker:
    runs-on: truner/cpu=8/nvme=true/run=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gpu:
    if: github.ref == 'refs/heads/main'
    runs-on: truner/runner=gpu-nvidia/run=${{ github.run_id }}
    steps:
      - run: nvidia-smi

  windows:
    runs-on: truner/runner=4cpu-windows-x64/run=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: dotnet --info
        shell: pwsh
