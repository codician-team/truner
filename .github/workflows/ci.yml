name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Jobs run on codician's own truner installation. Pull requests from forks run
# on GitHub-hosted runners: self-hosted machines never run code from outside
# the organization.
jobs:
  test:
    runs-on: "${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || format('truner-codician/cpu=8/run={0}-test', github.run_id) }}"
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: unit and integration tests
        env:
          TRUNER_DYNAMODB_LOCAL: http://localhost:8000
        run: go test -race ./...
      - name: magic cache against the real @actions/cache toolkit
        run: |
          mkdir -p /tmp/toolkit && cd /tmp/toolkit && npm init -y >/dev/null && npm install --silent @actions/cache
          cd "$GITHUB_WORKSPACE"
          TRUNER_NODE_E2E=/tmp/toolkit go test ./internal/cacheproxy -run NodeToolkit -v
      - name: lint CloudFormation template
        run: |
          pip install --quiet cfn-lint
          cfn-lint internal/deploy/template.yaml
      - name: shellcheck profiles
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null; }
          shellcheck -S warning internal/agent/profiles/*.sh install.sh
      - name: build
        run: go run ./tools/build -targets host -out /tmp/dist

  profiles:
    # Run the standard profile on real Ubuntu images. Each matrix job has its own
    # run token, so neither takes the other's machine.
    runs-on: "${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || format('truner-codician/cpu=4/run={0}-profiles-{1}', github.run_id, strategy.job-index) }}"
    strategy:
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04"]
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD/internal/agent/profiles:/p" ${{ matrix.image }} bash -c '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo >/dev/null &&
            useradd -m -u 1001 runner &&
            bash /p/standard.sh &&
            for t in git jq docker gh aws yq python3; do command -v $t >/dev/null || { echo "missing $t"; exit 1; }; done'
