name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Tags are pushed by maintainers only, so this always runs on codician's truner installation.
    runs-on: "truner-codician/cpu=8/run=${{ github.run_id }}-release"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build
        run: go run ./tools/build -version "${GITHUB_REF_NAME}" -repo "${GITHUB_REPOSITORY}" -out dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "truner ${GITHUB_REF_NAME}" \
            --notes "${notes:-See CHANGELOG.md}" \
            --verify-tag
