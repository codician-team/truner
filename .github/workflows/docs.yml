name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "CHANGELOG.md", "SECURITY.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "CHANGELOG.md", "SECURITY.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # Pages serves project sites from /<repository>/ (or / with a custom domain).
      # Pull requests and private repositories only check that the site builds.
      - id: pages
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/configure-pages@v6
      - name: build
        working-directory: docs
        env:
          DOCS_BASE: ${{ format('{0}/', steps.pages.outputs.base_path) }}
          DOCS_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
